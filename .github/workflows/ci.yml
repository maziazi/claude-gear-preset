name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: CLI smoke test
        shell: bash
        run: |
          node dist/cli.js --help
          node dist/cli.js list

  verify-dist:
    name: dist/ matches source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fail if dist/ was not rebuilt before committing
        run: git diff --exit-code dist/

  install-smoke:
    name: install without devDependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Packs exactly what a git- or registry-based install receives: no
      # build step runs here, since dist/ is already committed.
      - run: npm pack
      - name: Install globally with no devDependencies present
        run: npm install -g --omit=dev ./claude-gear-preset-*.tgz
      - name: Run the installed binary
        run: |
          ccgear --help
          ccgear list

  install-from-readme:
    # Only on push to main: needs GitHub's generated tarball for this exact
    # commit, which a PR from a fork cannot be assumed to produce reliably.
    if: github.event_name == 'push'
    name: install command from the README actually works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # npm's github: / git+https: protocols have a caching bug
      # (npm/cli#5170) that can symlink the install to a temp directory it
      # then deletes. The README recommends the archive tarball URL
      # specifically to avoid that, which is the one thing this job exists
      # to keep true.
      - name: Install exactly as the README instructs
        run: npm install -g "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz"
      - name: Run the installed binary
        run: |
          ccgear --help
          ccgear list
